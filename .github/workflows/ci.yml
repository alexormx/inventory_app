name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager -i config/brakeman.ignore

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libvips-dev imagemagick pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rspec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  system_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libvips-dev imagemagick pkg-config

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # jsbundling-rails output (app/assets/builds) is gitignored, so the browser
      # suite needs the esbuild bundles built before Sprockets can serve them.
      - name: Build JavaScript bundles
        run: npm run build

      # The runner image ships Chrome with a version-matched chromedriver exposed
      # through CHROMEWEBDRIVER; do not install another Chrome or they desync.
      - name: Verify browser toolchain
        run: |
          google-chrome --version
          driver="$CHROMEWEBDRIVER/chromedriver"
          [ -x "$driver" ] || driver="$(command -v chromedriver || true)"
          [ -x "$driver" ] || { echo "No chromedriver available on this runner"; exit 1; }
          "$driver" --version
          echo "CHROMEDRIVER_PATH=$driver" >> "$GITHUB_ENV"

      # La suite completa de sistema pasa en verde (54/54, repetido). Correrla
      # entera en CI es lo que impide que vuelva a acumularse deuda como la que
      # se limpió en #122: el subconjunto smoke dejaba 48 de 54 sin vigilancia.
      - name: Run system tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          RUN_SYSTEM_SPECS: 1
        run: bin/rails db:test:prepare && bundle exec rspec spec/system --format documentation

      - name: Keep failure artifacts from system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-failures
          path: |
            ${{ github.workspace }}/tmp/capybara
            ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      # DIAGNOSTICO TEMPORAL - rama desechable. El log del servidor es la
      # evidencia de "no llego ninguna peticion" que exige la clasificacion de
      # entrega nula; sin el no se distingue de un fallo cualquiera.
      - name: Keep Rails test log for zero-delivery classification
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rails-test-log
          path: ${{ github.workspace }}/log/test.log
          if-no-files-found: ignore
