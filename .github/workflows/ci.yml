name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager -i config/brakeman.ignore

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libvips-dev imagemagick pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rspec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  system_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libvips-dev imagemagick pkg-config

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # jsbundling-rails output (app/assets/builds) is gitignored, so the browser
      # suite needs the esbuild bundles built before Sprockets can serve them.
      - name: Build JavaScript bundles
        run: npm run build

      # DIAGNOSTICO TEMPORAL - rama desechable, no mergear.
      #
      # Unica variable independiente de este experimento: el par
      # Chrome/ChromeDriver. La imagen del runner trae Chrome 151.0.7922.173
      # junto a ChromeDriver 151.0.7922.138, es decir un par DESALINEADO en el
      # patch. Chrome for Testing no publica .173; el par exacto mas alto
      # disponible dentro de 151 es .138, que es justo la version del driver
      # que el runner ya usaba. Provisionamos AMBOS binarios de la misma
      # fuente y version para que Chrome y ChromeDriver coincidan exactamente.
      - name: Provision exact Chrome + ChromeDriver pair (Chrome for Testing)
        env:
          CFT_VERSION: 151.0.7922.138
        run: |
          set -euo pipefail
          base="https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64"
          dir="$RUNNER_TEMP/cft"
          mkdir -p "$dir"
          curl -fsSL "$base/chrome-linux64.zip"       -o "$dir/chrome.zip"
          curl -fsSL "$base/chromedriver-linux64.zip" -o "$dir/chromedriver.zip"
          unzip -q "$dir/chrome.zip"       -d "$dir"
          unzip -q "$dir/chromedriver.zip" -d "$dir"
          chrome="$dir/chrome-linux64/chrome"
          driver="$dir/chromedriver-linux64/chromedriver"
          chmod +x "$chrome" "$driver"
          echo "CHROME_BINARY_PATH=$chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$driver" >> "$GITHUB_ENV"

      # El experimento solo es valido si el par es EXACTO: si no lo es, el job
      # debe fallar aqui en vez de producir una corrida no interpretable.
      - name: Require exact Chrome/ChromeDriver version match
        env:
          CFT_VERSION: 151.0.7922.138
        run: |
          set -euo pipefail
          echo "runner-provided Chrome:  $(google-chrome --version 2>/dev/null || echo 'n/a')"
          echo "Chrome binary path:      $CHROME_BINARY_PATH"
          echo "ChromeDriver path:       $CHROMEDRIVER_PATH"
          cv="$("$CHROME_BINARY_PATH" --version)"
          dv="$("$CHROMEDRIVER_PATH" --version)"
          echo "Chrome version:          $cv"
          echo "ChromeDriver version:    $dv"
          cvn="$(printf '%s' "$cv" | grep -oE '[0-9]+(\.[0-9]+){3}' | head -1)"
          dvn="$(printf '%s' "$dv" | grep -oE '[0-9]+(\.[0-9]+){3}' | head -1)"
          echo "parsed chrome=$cvn driver=$dvn expected=$CFT_VERSION"
          [ "$cvn" = "$CFT_VERSION" ] || { echo "FAIL: Chrome $cvn != $CFT_VERSION"; exit 1; }
          [ "$dvn" = "$CFT_VERSION" ] || { echo "FAIL: ChromeDriver $dvn != $CFT_VERSION"; exit 1; }
          echo "EXACT PAIR OK: $CFT_VERSION"

      # La suite completa de sistema pasa en verde (54/54, repetido). Correrla
      # entera en CI es lo que impide que vuelva a acumularse deuda como la que
      # se limpió en #122: el subconjunto smoke dejaba 48 de 54 sin vigilancia.
      #
      # Se excluye UNICAMENTE la etiqueta browser_input_quarantine, que marca un
      # solo ejemplo: el cierre de sesion extremo a extremo por navegador real.
      # No se excluye el archivo, ni una linea, ni una lista de tests inestables;
      # el resto de user_login_spec.rb, incluido el login por UI, sigue
      # bloqueando. Ese ejemplo se sigue ejecutando a diario y bajo demanda en
      # .github/workflows/browser-input-diagnostic.yml, que documenta el motivo,
      # el alcance y la condicion de salida de la cuarentena.
      - name: Run system tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          RUN_SYSTEM_SPECS: 1
        run: bin/rails db:test:prepare && bundle exec rspec spec/system --tag '~browser_input_quarantine' --format documentation

      - name: Keep failure artifacts from system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-failures
          path: |
            ${{ github.workspace }}/tmp/capybara
            ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      # DIAGNOSTICO TEMPORAL - rama desechable. El log del servidor es la
      # evidencia de "no llego ninguna peticion" que exige la clasificacion de
      # entrega nula; sin el no se puede distinguir de un fallo cualquiera.
      - name: Keep Rails test log for zero-delivery classification
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rails-test-log
          path: ${{ github.workspace }}/log/test.log
          if-no-files-found: ignore
