name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager -i config/brakeman.ignore

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libvips-dev imagemagick pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rspec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  system_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libvips-dev imagemagick pkg-config

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # jsbundling-rails output (app/assets/builds) is gitignored, so the browser
      # suite needs the esbuild bundles built before Sprockets can serve them.
      - name: Build JavaScript bundles
        run: npm run build

      # The runner image ships Chrome with a version-matched chromedriver exposed
      # through CHROMEWEBDRIVER; do not install another Chrome or they desync.
      - name: Verify browser toolchain
        run: |
          google-chrome --version
          driver="$CHROMEWEBDRIVER/chromedriver"
          [ -x "$driver" ] || driver="$(command -v chromedriver || true)"
          [ -x "$driver" ] || { echo "No chromedriver available on this runner"; exit 1; }
          "$driver" --version
          echo "CHROMEDRIVER_PATH=$driver" >> "$GITHUB_ENV"

      # La suite completa de sistema pasa en verde (54/54, repetido). Correrla
      # entera en CI es lo que impide que vuelva a acumularse deuda como la que
      # se limpió en #122: el subconjunto smoke dejaba 48 de 54 sin vigilancia.
      #
      # Se excluye UNICAMENTE la etiqueta browser_input_quarantine, que marca un
      # solo ejemplo: el cierre de sesion extremo a extremo por navegador real.
      # No se excluye el archivo, ni una linea, ni una lista de tests inestables;
      # el resto de user_login_spec.rb, incluido el login por UI, sigue
      # bloqueando. Ese ejemplo se sigue ejecutando a diario y bajo demanda en
      # .github/workflows/browser-input-diagnostic.yml, que documenta el motivo,
      # el alcance y la condicion de salida de la cuarentena.
      - name: Run system tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          RUN_SYSTEM_SPECS: 1
        run: bin/rails db:test:prepare && bundle exec rspec spec/system --tag '~browser_input_quarantine' --format documentation

      - name: Keep failure artifacts from system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-failures
          path: |
            ${{ github.workspace }}/tmp/capybara
            ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      # DIAGNÓSTICO TEMPORAL — rama desechable. El log del driver se sube pase
      # lo que pase: si la corrida es verde también sirve como referencia de un
      # click sano contra el cual comparar uno fallido.
      - name: Upload ChromeDriver verbose log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromedriver-verbose-log
          path: ${{ github.workspace }}/tmp/chromedriver
          if-no-files-found: ignore

      # DIAGNÓSTICO TEMPORAL — rama desechable. Chrome puede aceptar las flags
      # y aun así no escribir el archivo (medido localmente: --log-file solo se
      # ignora). Esto comprueba que el log existe, no está vacío y lo escribió
      # Chrome de verdad, en lugar de darlo por hecho.
      - name: Verify Chrome native log was actually written
        if: always()
        run: |
          dir="${{ github.workspace }}/tmp/chrome"
          if [ ! -d "$dir" ]; then echo "MISSING: $dir was never created"; exit 0; fi
          ls -la "$dir"
          found=0
          for f in "$dir"/*.log; do
            [ -e "$f" ] || continue
            found=1
            bytes=$(wc -c < "$f")
            lines=$(wc -l < "$f")
            chrome_lines=$(grep -cE '^\[[0-9]{4}/[0-9]{6}\.[0-9]+:(INFO|VERBOSE[0-9]|WARNING|ERROR|FATAL)' "$f" || true)
            echo "file=$f bytes=$bytes lines=$lines chrome_formatted_lines=$chrome_lines"
            echo "--- head ---"; head -3 "$f"
          done
          [ "$found" = "1" ] || echo "MISSING: no .log files under $dir"

      - name: Upload Chrome native log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-native-log
          path: ${{ github.workspace }}/tmp/chrome
          if-no-files-found: ignore
